<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Miners Arms Brereton - Poster & Display System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        timber: {
                            dark: '#1a120b',
                            DEFAULT: '#2c1e13',
                            light: '#3d291a',
                        },
                        gold: {
                            light: '#f3e5ab',
                            DEFAULT: '#d4af37',
                            dark: '#aa8c2c',
                            metallic: '#ffd700'
                        },
                        pub: {
                            cream: '#f9f6f0',
                            charcoal: '#121212',
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #121212;
            color: #f9f6f0;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa8c2c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wood-texture {
            background-color: #2c1e13;
            background-image: radial-gradient(circle at 50% 50%, rgba(61, 41, 26, 0.6) 0%, rgba(26, 18, 11, 0.9) 100%);
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a120b;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f3e5ab;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-x-hidden relative">

    <header class="wood-texture border-b border-gold/30 sticky top-0 z-40 px-4 py-3 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full border-2 border-gold flex items-center justify-center bg-timber-dark text-gold shadow-lg relative overflow-hidden group">
                    <svg class="w-8 h-8 text-gold" viewBox="0 0 100 100" fill="currentColor">
                        <path d="M15 20 L85 80 M85 20 L15 80" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
                        <path d="M30 45 Q50 20 70 45 L75 60 Q50 65 25 60 Z" fill="#d4af37"/>
                        <circle cx="50" cy="45" r="6" fill="#1a120b"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-cinzel font-bold text-xl md:text-2xl gold-gradient-text tracking-wider">The Miners Arms</h1>
                    <p class="text-xs text-gold/80 tracking-widest uppercase">Brereton • Cloud Connected</p>
                </div>
            </div>

            <nav class="flex flex-wrap items-center gap-2">
                <button onclick="switchTab('posters')" id="btn-posters" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition-all duration-300 bg-gold text-timber-dark shadow-md flex items-center space-x-2">
                    <i class="fa-solid fa-image"></i><span>Posters</span>
                </button>
                <button onclick="switchTab('generator')" id="btn-generator" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-gold-light hover:bg-timber-light flex items-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i><span>Generator</span>
                </button>
                <button onclick="switchTab('games')" id="btn-games" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-gold-light hover:bg-timber-light flex items-center space-x-2">
                    <i class="fa-solid fa-ticket"></i><span>Lottery & Bonus</span>
                </button>
                <button onclick="switchTab('tv')" id="btn-tv" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-gold-light hover:bg-timber-light flex items-center space-x-2">
                    <i class="fa-solid fa-tv"></i><span>TV Live View</span>
                </button>
                <button onclick="switchTab('archive')" id="btn-archive" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-gold-light hover:bg-timber-light flex items-center space-x-2">
                    <i class="fa-solid fa-box-archive"></i><span>Archive</span>
                </button>
                <button onclick="switchTab('admin')" id="btn-admin" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition-all duration-300 text-gold-light hover:bg-timber-light flex items-center space-x-2">
                    <i class="fa-solid fa-shield-halved"></i><span>Admin</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 overflow-y-auto">

        <!-- POSTERS DISPLAY TAB -->
        <section id="tab-posters" class="tab-content space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-timber/60 p-6 rounded-2xl border border-gold/20">
                <div>
                    <h2 class="font-cinzel text-3xl font-bold gold-gradient-text">Active Pub Posters & Notices</h2>
                    <p class="text-gold/70 text-sm mt-1">Synchronized in real-time across all display monitors in The Miners Arms. Click any poster for detail view.</p>
                </div>
                <div class="flex items-center gap-3">
                    <select id="poster-filter" onchange="filterPosters()" class="bg-timber-dark border border-gold/40 text-gold-light rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-gold">
                        <option value="all">All Categories</option>
                        <option value="events">Events & Music</option>
                        <option value="sports">Live Sports</option>
                        <option value="drinks">Drinks & Specials</option>
                        <option value="games">Pub Games</option>
                    </select>
                </div>
            </div>

            <div id="posters-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic Posters Generated Here -->
            </div>
        </section>

        <!-- POSTER STUDIO GENERATOR TAB -->
        <section id="tab-generator" class="tab-content hidden space-y-6">
            <div class="bg-timber/60 p-6 rounded-2xl border border-gold/20">
                <h2 class="font-cinzel text-3xl font-bold gold-gradient-text">Pub Poster Studio</h2>
                <p class="text-gold/70 text-sm mt-1">Design customized notices using authentic Miners Arms templates and push directly to TVs.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 bg-timber/5
